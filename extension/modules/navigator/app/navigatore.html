<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui;background:#f6f6f4}[hidden]{display:none!important}</style></head><body><title>Navigatore Chiamata Agria</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Navigator 2.0 · una colonna (max 820px). In alto: azienda e timer. Nella scheda: la frase da dire SOPRA, poi la risposta del cliente
   come pochi pulsanti. In basso, fissi: Indietro, SOS, Termina · esito. Colori sobri: il significato è sempre anche nel testo e nell'icona. */
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --fg:#1A1F1B; --muted:#5F6761; --line:#D7DCD2; --line-strong:#B9C1B3;
  --accent:#3B6A3A; --accent-ink:#FFFFFF; --accent-soft:#E4EEE1;
  --you-bg:#F7F8F4; --you-edge:#3B6A3A;
  --client-bg:#F4F6F1; --client-hover:#E9EDE4; --client-fg:#1A1F1B;
  --ph:#8A4F06; --ph-bg:#FCEBD1; --fill:#3E4D7A; --fill-bg:#E7EBF7; --fb:#4A5650;
  --warn:#9A5F0C; --warn-bg:#FCEBD1; --danger:#A33A2E; --danger-bg:#FBE9E6; --danger-ink:#FFFFFF; --op:#5F6761; --op-bg:#E6E9E3;
  --sos:#C0392B; --sos-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(20,30,20,.06),0 8px 24px rgba(20,30,20,.06);
  --font-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-say:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111412; --surface:#1A1F1B; --fg:#E7EAE3; --muted:#9AA397; --line:#2B322C; --line-strong:#3E473F;
  --accent:#8FC482; --accent-ink:#0F1A0E; --accent-soft:#1F2E1E;
  --you-bg:#1F2521; --you-edge:#8FC482;
  --client-bg:#202722; --client-hover:#2A322C; --client-fg:#E7EAE3;
  --ph:#E9B86A; --ph-bg:#3A2D12; --fill:#AFBCE6; --fill-bg:#262C3D; --fb:#C3CBC0;
  --warn:#E9B86A; --warn-bg:#3A2D12; --danger:#F09A8E; --danger-bg:#3A1F1B; --danger-ink:#1A0E0C; --op:#B5BDB2; --op-bg:#2B322C;
  --sos:#E04B3A; --sos-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111412; --surface:#1A1F1B; --fg:#E7EAE3; --muted:#9AA397; --line:#2B322C; --line-strong:#3E473F;
  --accent:#8FC482; --accent-ink:#0F1A0E; --accent-soft:#1F2E1E;
  --you-bg:#1F2521; --you-edge:#8FC482;
  --client-bg:#202722; --client-hover:#2A322C; --client-fg:#E7EAE3;
  --ph:#E9B86A; --ph-bg:#3A2D12; --fill:#AFBCE6; --fill-bg:#262C3D; --fb:#C3CBC0;
  --warn:#E9B86A; --warn-bg:#3A2D12; --danger:#F09A8E; --danger-bg:#3A1F1B; --danger-ink:#1A0E0C; --op:#B5BDB2; --op-bg:#2B322C;
  --sos:#E04B3A; --sos-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
input,textarea,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:14px 120px}

/* barra alta */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1 1 auto}
.brand .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .n{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);min-width:64px;text-align:center}
.timer.live{border-color:var(--accent);color:var(--accent)}
.timer.warn{border-color:var(--warn);color:var(--warn)}
.tbtn{padding:7px 12px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap}
.tbtn:hover{border-color:var(--accent)}

/* scheda */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 20px 18px}
.card.flash{animation:flash .8s ease-out 1}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:var(--shadow)}}
@media (prefers-reduced-motion: reduce){.card.flash{animation:none}}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.eyebrow .trail{color:var(--muted);font-weight:600;letter-spacing:0;text-transform:none;font-size:12.5px}
h1{font-size:21px;line-height:1.25;margin:4px 0 12px;text-wrap:balance;font-weight:700}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:16px 0 8px}
.label .small{text-transform:none;letter-spacing:0;font-weight:500}
.say{border-left:4px solid var(--you-edge);background:var(--you-bg);border-radius:0 12px 12px 0;padding:14px 18px;display:grid;gap:12px}
.say p{margin:0;font-family:var(--font-say);font-size:21px;line-height:1.45;max-width:66ch}
.say p.alt{padding-top:10px;border-top:1px dashed var(--line-strong);font-size:19px}
.say p.alt:first-child{padding-top:0;border-top:0}
.say p.alt .al{display:block;font-family:var(--font-ui);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:4px}
.say p.note{font-family:var(--font-ui);font-size:13px;color:var(--muted);font-weight:600}
@media (max-width:560px){.say p{font-size:19px}.say p.alt{font-size:17px}.card{padding:16px 14px 14px}}
.tok.v{font-weight:600;color:var(--accent)}
.tok.ph{background:var(--ph-bg);color:var(--ph);padding:0 6px;border-radius:6px;font-weight:600;white-space:nowrap;font-size:.8em;font-family:var(--font-ui);vertical-align:middle}
.tok.fb{color:var(--fb)}
.fill{background:var(--fill-bg);color:var(--fill);padding:0 5px;border-radius:5px;font-weight:500}

/* risposte del cliente: colore + icona + testo */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
@media (max-width:560px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;padding:11px 12px;border:1px solid var(--line-strong);border-left-width:5px;border-radius:12px;background:var(--client-bg);color:var(--client-fg);min-height:54px;transition:background .12s}
.opt:hover:not(:disabled){background:var(--client-hover)}
.opt .ic{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.opt .ic svg{width:14px;height:14px}
.opt .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt .l{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.opt .h{font-size:12px;color:var(--muted)}
.t-go{border-left-color:var(--accent)!important}.t-go .ic{background:var(--accent);color:var(--accent-ink)}
.t-wait{border-left-color:var(--warn)!important}.t-wait .ic{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.t-stop{border-left-color:var(--danger)!important}.t-stop .ic{background:var(--danger-bg);color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.t-op{border-left-color:var(--op)!important}.t-op .ic{background:var(--op-bg);color:var(--op);box-shadow:inset 0 0 0 1.5px var(--op)}
.ogroup+.ogroup{margin-top:10px}
.ghead{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.ghead .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center}.ghead .ic svg{width:11px;height:11px}
@media (max-width:560px){.opt{padding:9px 10px;gap:8px;min-height:50px}.opt .l{font-size:14px}.opt .ic{width:20px;height:20px}}

/* box da compilare durante la chiamata */
.cap{margin-top:12px;padding:12px 14px;border:2px solid var(--accent);border-radius:12px;background:var(--surface)}
.cap.soft{border-style:dashed;border-color:var(--line-strong)}
.cap .cl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:8px}
.cap.soft .cl{color:var(--muted)}
.capgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
/* il nome dell'interlocutore: grande, subito sotto la domanda, si scrive mentre lo dice */
.cap.name .cl{display:block}
.cap.name input{width:100%;min-width:0;padding:12px 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);font-size:22px;font-weight:600}
.cap.name .namerow{display:flex;gap:6px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:8px}
.cap.name .linkbtn{margin-left:0}

/* campi */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field>label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none}
.field .req{color:var(--danger);font-weight:700}
.field input,.field textarea,.field select{padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);width:100%;min-width:0;font-size:15px}
.field textarea{min-height:64px;resize:vertical}
.field.miss input,.field.miss select,.field.miss textarea,.field.miss .seg button{border-color:var(--danger)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip-btn{padding:5px 10px;border-radius:999px;border:1px solid var(--line-strong);background:var(--client-bg);font-size:12.5px;font-weight:600}
.chip-btn:hover{background:var(--client-hover)}
.chip-btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:13.5px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.preview{margin-top:6px;padding:8px 12px;border-radius:10px;background:var(--you-bg);border-left:3px solid var(--you-edge);font-family:var(--font-say);font-size:16px;line-height:1.4}
.preview .small{font-family:var(--font-ui)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.slots{grid-template-columns:1fr}}
.slot{padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.slot .sl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:6px}
.slot .sr{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
.slot select{padding:9px 10px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);min-width:0;width:100%}
.slot .out{margin-top:6px;font-family:var(--font-say);font-size:16px}
details.more{margin-top:14px}
details.more>summary{list-style:none;cursor:pointer;display:inline-flex;gap:8px;align-items:center;padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface)}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{margin-bottom:10px}
.notice{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--danger-bg);color:var(--danger);font-weight:600;font-size:14px}
.notice.ok{background:var(--accent-soft);color:var(--accent)}
.notice.info{background:var(--op-bg);color:var(--fg);font-weight:500}
.small{font-size:13px;color:var(--muted)}
.lastsaved{margin:-4px 0 12px;font-size:13px;color:var(--muted)}
/* indicazioni per il commerciale: NON si dicono, quindi stanno fuori dal blocco «Tu dici» e hanno un aspetto diverso */
.cue{margin:4px 0 10px;font-size:13px;color:var(--muted);font-weight:600}
.pausecue{display:inline-flex;align-items:center;gap:8px;margin:10px 0 2px;padding:5px 12px 5px 6px;border-radius:999px;background:var(--op-bg);color:var(--fg);font-size:13px;font-weight:700}
.pausecue .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted)}.pausecue .ic svg{width:12px;height:12px}

/* esito */
.sum{margin:0;display:grid;gap:10px}
.sum .row2{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--you-bg)}
.sum dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-top:2px}
.sum dd{margin:0;font-weight:600;font-size:15px;min-width:0}
@media (max-width:560px){.sum .row2{grid-template-columns:1fr;gap:4px}}
.ochip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px;border:1px solid var(--line-strong);border-left-width:4px;background:var(--surface);font-weight:700}
.ochip .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center}.ochip .ic svg{width:12px;height:12px}
.linkbtn{margin-left:8px;border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;text-decoration:underline;padding:2px}
.future{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14px}
.ofields{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}

/* tabella delle schede di approfondimento */
.tech{display:grid;gap:6px;margin-top:10px}
.tech div{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.tech div span:first-child{color:var(--muted);font-weight:600}
@media (max-width:560px){.tech div{grid-template-columns:1fr}}

/* pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14.5px;min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{background:var(--danger);color:var(--danger-ink);border-color:var(--danger);font-weight:700}
.btn.ghost{background:transparent}
.btn.sos{background:var(--sos);color:var(--sos-ink);border-color:var(--sos);font-weight:800;letter-spacing:.04em}
.btn.end{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.btn .short{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}

/* barra bassa */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bottom .in{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bottom .spacer{flex:1}
.bottom .btn.wide{flex:1 1 auto}
@media (max-width:560px){.bottom{padding-inline:10px}.bottom .btn{padding:10px 12px;font-size:14px}.btn .full{display:none}.btn .short{display:inline}}

/* pannelli */
.panel{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(10,14,10,.45)}
.panel .sheet{width:min(560px,100%);height:100%;overflow:auto;background:var(--surface);padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.panel h2{margin:0;font-size:19px}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.phead .sp{flex:1}
.panel.center{justify-content:center;align-items:center;padding:16px}
#quickPanel{z-index:50} #dncPanel{z-index:55} /* l'Esito rapido si apre anche sopra l'SOS */
.panel .sheet.dialog{height:auto;max-height:92vh;border-radius:16px;width:min(620px,100%)}
.qgroup+.qgroup{margin-top:14px}
.qgroup .opts{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
@media (max-width:560px){.qgroup .opts{grid-template-columns:repeat(2,minmax(0,1fr))}.qgroup+.qgroup{margin-top:10px}}
.dnc p{font-size:17px;margin:0 0 6px}

/* SOS a tutto schermo */
.panel.full{padding:0}
.panel.full .sheet{width:100%;max-width:none;border-radius:0;padding:14px clamp(16px,4vw,48px) 24px}
.sos .inner{max-width:1000px;margin:0 auto}
.sos .phead{position:sticky;top:-14px;z-index:2;background:var(--surface);margin:-14px 0 8px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.sos .phead h2{color:var(--danger);font-size:22px;letter-spacing:.06em}
.sos h3{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.topics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.topics button{min-height:72px;padding:12px 14px;border:2px solid var(--line-strong);border-radius:14px;background:var(--you-bg);font-weight:700;font-size:18px;line-height:1.2;text-align:left}
.topics button:hover{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:760px){.topics{grid-template-columns:repeat(2,minmax(0,1fr))}.topics button{min-height:60px;font-size:16px}}
.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line-strong);border-radius:999px;font-size:16px;background:var(--surface) no-repeat 14px center/18px 18px url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235F6761' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>")}
.sos .ans-title{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:8px 0 8px}
.sos .ans .say p{font-size:24px}
.sos .ans .say p.bridge{font-size:20px;padding-top:10px;border-top:1px dashed var(--line-strong)}
.sos .ans .say p.note{font-size:14px}
@media (max-width:560px){.sos .ans .say p{font-size:20px}.sos .ans .say p.bridge{font-size:18px}}
.ref h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.ref ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{padding:7px 11px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:13px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rchips{display:flex;gap:6px;flex-wrap:wrap}
.rchip{padding:4px 10px;border-radius:999px;background:var(--client-bg);font-size:13px;font-weight:600}
.rchip.bad{text-decoration:line-through;color:var(--muted)}
.rchip.ok{background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>

<header class="top">
  <div class="in">
    <div class="brand"><span class="k" id="brandK">Agria System · Navigatore chiamata</span><span class="n" id="brandN">Prima chiamata di follow-up</span></div>
